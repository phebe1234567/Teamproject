<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh; 
            margin: 0;
            padding: 1rem; 
            box-sizing: border-box; 
        }
        #calculator-app {
            background-color: #ffffff; 
            border-radius: 1.5rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            padding: 1.5rem;
            width: 100%;
            max-width: 400px; 
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        #display {
            background-color: #e2e8f0;
            text-align: right;
            font-size: 2.5rem; 
            padding: 1rem;
            border-radius: 0.75rem;
            border: none;
            color: #1a202c; 
            width: calc(100% - 2rem); 
            box-sizing: border-box; 
        }
        #buttons-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr); 
            gap: 0.75rem;
        }
        .calculator-button {
            background-color: #4a5568;
            color: #ffffff; 
            font-size: 1.75rem; 
            padding: 1rem;
            border-radius: 0.75rem; 
            border: none;
            cursor: pointer;
            transition: background-color 0.2s ease; 
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            display: flex; 
            justify-content: center;
            align-items: center;
        }
        .calculator-button:hover {
            background-color: #2d3748; 
        }
        .operator { 
            background-color: #3182ce; 
        }
        .operator:hover {
            background-color: #2b6cb0;
        }
        .equals { 
            background-color: #38a169;
            grid-column: span 2; 
        }
        .equals:hover {
            background-color: #2f855a;
        }
        #clear-button {
            background-color: #e53e3e;
        }
        #clear-button:hover {
            background-color: #c53030;
        }
        #history {
            background-color: #f7fafc; 
            border-radius: 0.75rem;
            padding: 1rem;
            margin-top: 1rem;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.06); 
            min-height: 100px; 
            overflow-y: auto; 
        }
        #history h2 {
            font-size: 1.25rem;
            color: #2d3748;
            margin-bottom: 0.75rem;
            text-align: center;
        }
        #history p {
            font-size: 1rem;
            color: #4a5568;
            padding: 0.25rem 0;
            border-bottom: 1px dashed #e2e8f0;
        }
        #history p:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body>
    
    <div id="calculator-app">
        <input type="text" id="display" value="0" readonly>
        <div id="buttons-container">
            <button id="clear-button" class="calculator-button">C</button>
            <button id="divide-button" class="calculator-button operator">/</button>
            <button id="multiply-button" class="calculator-button operator">*</button>
            <button id="subtract-button" class="calculator-button operator">-</button>
            <button id="add-button" class="calculator-button operator">+</button>
            <button id="seven-button" class="calculator-button number">7</button>
            <button id="eight-button" class="calculator-button number">8</button>
            <button id="nine-button" class="calculator-button number">9</button>
            <button id="four-button" class="calculator-button number">4</button>
            <button id="five-button" class="calculator-button number">5</button>
            <button id="six-button" class="calculator-button number">6</button>
            <button id="one-button" class="calculator-button number">1</button>
            <button id="two-button" class="calculator-button number">2</button>
            <button id="three-button" class="calculator-button number">3</button>
            <button id="zero-button" class="calculator-button number">0</button>
            <button id="decimal-button" class="calculator-button">.</button>
            <button id="equals-button" class="calculator-button equals">=</button>
        </div>
        <div id="history">
            <h2>Calculation History</h2>
        </div>
    </div>

     <script src="script.js"></script>
</body>
</html>
